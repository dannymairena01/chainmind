services:
  - type: web
    name: chainmind-agent
    env: node
    region: oregon # Or whatever region you prefer
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @chainmind/agent build && cd apps/agent && npx prisma generate
    startCommand: pnpm --filter @chainmind/agent start
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: PRIVY_APP_ID
        sync: false
      - key: PRIVY_APP_SECRET
        sync: false
      - key: ALCHEMY_API_KEY
        sync: false
      - key: CDP_API_KEY_NAME
        sync: false
      - key: CDP_API_KEY_SECRET
        sync: false
      - key: NEXT_PUBLIC_FRONTEND_URL
        sync: false
      - key: PRIVATE_KEY
        sync: false
